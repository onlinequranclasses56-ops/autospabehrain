<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="AutoSpa Bahrain">
  <style>
    .bg  { fill: #0B0C0E }
    .bd  { stroke: rgba(212,175,55,0.50); fill: none }
    .mk  { stroke: #D4AF37; fill: none }
    .gw  { fill: rgba(212,175,55,0.11) }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #F5F3EE }
      .bd  { stroke: rgba(155,122,18,0.55) }
      .mk  { stroke: #9B7A12 }
      .gw  { fill: rgba(212,175,55,0.09) }
    }
  </style>

  <!-- Card -->
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Gold border ring -->
  <rect class="bd" x="1" y="1" width="30" height="30" rx="6.5" stroke-width="0.75"/>

  <!-- Subtle radial glow behind the mark -->
  <ellipse class="gw" cx="16" cy="15" rx="10" ry="9"/>

  <!--
    Geometric "A" lettermark
    Apex: (16, 5)   Bottom-left: (6, 26)   Bottom-right: (26, 26)
    Crossbar at y=18: x ≈ 10 → 22  (≈60% down the legs)
  -->
  <path
    class="mk"
    d="M16 5 L6 26 M16 5 L26 26 M10 18 H22"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
